<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>價格卡排版 · 258民生雜糧行</title>
<style>
  :root{
    --ink:#14231a;
    --green:#2e7d32;
    --green-dk:#1b5e20;
    --red:#d32f2f;
    --line:#d7ded8;
    --bg:#eef1ec;
    --panel:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{background:var(--bg);color-scheme:light;overflow-x:hidden}
  #panel{background:var(--bg);color:var(--ink)}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
    -webkit-text-size-adjust:100%;
    overscroll-behavior:none;
    overflow-x:hidden;
  }

  /* ---------- 舞台 ---------- */
  #stageWrap{
    position:sticky;top:0;z-index:5;
    padding:8px 0 6px;background:var(--bg);
    border-bottom:1px solid var(--line);
    overflow:hidden;
    touch-action:none;
  }
  #stageBox{position:relative;margin:0 auto;overflow:hidden}
  #stage{transform-origin:top left;width:210mm;height:297mm}
  body.folded #stageBox{display:none}
  #foldBar{display:flex;justify-content:center;align-items:center;gap:10px;padding:4px 0 0}
  #splitter{
    width:120px;height:22px;display:flex;align-items:center;justify-content:center;
    cursor:ns-resize;touch-action:none;border-radius:20px;background:#dfe5e0;
  }
  #splitter::before{content:"";width:52px;height:4px;border-radius:3px;background:#9aa89e}
  #dirty{
    display:none;margin-top:10px;padding:9px 11px;border-radius:8px;
    background:#fff4e0;border:1px solid #f0c27a;color:#8a5a00;font-size:13px;font-weight:700;
  }
  #dirty.show{display:block}
  #b-update.hot{background:#e07b00;border-color:#e07b00;color:#fff}
  .sub{font-weight:400;font-size:11px;color:#6d7a72}
  .btns button.on{background:var(--green);border-color:var(--green);color:#fff}
  .btns button.on .sub{color:rgba(255,255,255,.85)}
  #b-fold{font-size:12px;padding:5px 14px;border-radius:20px;color:#4a5a50}
  .pg{
    position:relative;width:210mm;height:297mm;background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .pg:not(.cur){display:none}
  #stage.measuring .pg{display:block!important}
  .safe{
    position:absolute;left:3mm;top:3mm;width:204mm;height:291mm;
    border:0.4mm dashed #7cc48a;pointer-events:none;
  }
  #pager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;padding:0 8px 6px}
  #pager button{font-size:13px;padding:5px 12px;border-radius:20px}
  #pager #pg-label{font-size:13px;font-weight:700;min-width:74px;text-align:center}
  #pager .pg-move{background:#1565c0;border-color:#1565c0;color:#fff}
  #pager .pg-del{color:#b33;border-color:#e0a5a5}
  #pager [hidden]{display:none}
  .card .keep{
    position:absolute;left:0;right:0;bottom:0;z-index:1;pointer-events:none;
    background:repeating-linear-gradient(135deg,rgba(0,0,0,.06) 0 2mm,transparent 2mm 4mm);
    border-top:0.3mm dashed #aab3ad;color:#8a958e;font-size:3.2mm;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- 卡片 ---------- */
  .card{
    position:absolute;background:#fff;color:#111;overflow:hidden;
    transform-origin:center center;
    display:flex;flex-direction:column;justify-content:space-between;
    touch-action:none;cursor:move;
  }
  .card.crop{outline:0.3mm dashed #9aa39c;outline-offset:-0.15mm}
  .card.sale{background:#fff;color:#111}
  .card .badge{
    position:absolute;top:2mm;right:2mm;z-index:3;
    color:var(--red);font-weight:900;line-height:1.05;white-space:nowrap;
    display:flex;align-items:center;justify-content:center;
  }
  .card .badge .bt{position:relative;z-index:2}
  .card .badge svg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1}

  .badge.b-tag{background:#ffd60a;border:0.6mm solid var(--red);border-radius:1.5mm;
    padding:1.2mm 3mm;transform:rotate(7deg);box-shadow:0 0.6mm 0 rgba(0,0,0,.12)}
  .badge.b-burst{padding:4.5mm 6mm;transform:rotate(-6deg)}
  .badge.b-cloud{padding:4mm 6mm}
  .badge.b-stamp{background:#ffd60a;border:0.7mm solid var(--red);border-radius:50%;
    aspect-ratio:1;padding:3mm;transform:rotate(-12deg);
    box-shadow:0 0 0 0.5mm #ffd60a,0 0 0 1mm var(--red)}
  .badge.b-double{flex-direction:column;gap:0.4mm;background:#ffd60a;
    padding:1.4mm 3mm 0.6mm;border-bottom:2.2mm solid var(--red);transform:rotate(-3deg)}
  .badge.b-ribbon{top:8mm;right:-16mm;width:60mm;padding:1.6mm 0;border-radius:0;
    background:#ffd60a;border-top:0.5mm solid var(--red);border-bottom:0.5mm solid var(--red);
    transform:rotate(45deg);letter-spacing:.15em}
  .card .nm{font-weight:900;line-height:1.08;letter-spacing:-0.02em;word-break:break-all}
  .card .pr{display:flex;align-items:baseline;gap:1.5mm;line-height:1;touch-action:none}
  .card .pr.movable{cursor:move;outline:0.4mm dashed rgba(21,101,192,.55);outline-offset:1.2mm}
  .card .num{font-weight:900;color:var(--red);letter-spacing:-0.03em}
  .card .un{font-weight:700;opacity:.85}
  .card .sp{opacity:.72;line-height:1.3;word-break:break-all}
  .card .bar{background:var(--green);width:100%}
  .card .shop{font-weight:700;color:var(--green-dk);letter-spacing:.04em}
  .card.lay-h{flex-direction:row;align-items:center;gap:2mm}
  .card.lay-h .left{flex:1 1 auto;min-width:0;height:100%;display:flex;
    flex-direction:column;justify-content:center;gap:1.2mm}
  .card.lay-h .left .ft{margin-top:auto}
  .card.lay-h .rightcol{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end}
  .card .mid{display:flex;flex-direction:column;gap:2mm;justify-content:center;flex:1}
  .card .ft{display:flex;flex-direction:column;gap:1.2mm}

  .sel{box-shadow:0 0 0 0.7mm var(--green) inset}
  .hdl{position:absolute;touch-action:none}
  .h-res{right:0;bottom:0;background:var(--green);
    clip-path:polygon(100% 0,100% 100%,0 100%);cursor:nwse-resize}
  .h-rot{right:0;top:0;background:#1565c0;border-radius:0 0 0 100%;cursor:grab}

  /* ---------- 控制面板 ---------- */
  #panel{padding:12px 14px 40px;max-width:560px;margin:0 auto}
  h2{font-size:15px;margin:18px 0 8px;font-weight:700;color:var(--green-dk)}
  h2:first-child{margin-top:4px}
  label{display:block;font-size:13px;margin:0 0 3px;color:#4a5a50}
  select{width:100%;padding:10px 11px;font-size:16px;border:1px solid var(--line);
    border-radius:8px;background:#fff;font-family:inherit;color:var(--ink)}
  input[type=text],input[type=number]{
    width:100%;padding:10px 11px;font-size:16px;border:1px solid var(--line);
    border-radius:8px;background:#fff;font-family:inherit;
  }
  input:focus{outline:2px solid var(--green);outline-offset:-1px}
  .row{display:flex;gap:8px}
  .row>div{flex:1}
  .fld{margin-bottom:10px}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0}
  .chk input{width:20px;height:20px;accent-color:var(--green)}
  input[type=range]{width:100%;accent-color:var(--green);height:28px}
  .sl{display:flex;align-items:center;gap:10px}
  .sl .v{min-width:62px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;color:#4a5a50}
  .sl button{flex:0 0 auto}
  button{
    font-family:inherit;font-size:14px;font-weight:700;padding:11px 12px;
    border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);
  }
  button:active{transform:translateY(1px)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .b-main{background:var(--green);border-color:var(--green);color:#fff}
  .b-warn{background:#fff;border-color:#e0a5a5;color:#b33}
  .b-print{background:var(--ink);border-color:var(--ink);color:#fff;grid-column:1/-1}
  .tiny{font-size:12px;color:#6d7a72;margin:6px 0 0}
  #tip{font-size:12px;color:#6d7a72;text-align:center;padding:6px 10px 0}

  /* ---------- 電腦版：左邊規格、右邊預覽 ---------- */
  #deskBar{display:none}
  @media screen and (min-width:900px){
    html,body{height:100%;overflow:hidden}
    body{
      display:grid;
      grid-template-columns:minmax(380px,440px) minmax(0,1fr);
      grid-template-rows:auto minmax(0,1fr);
    }
    #panel{
      grid-column:1;grid-row:1/3;
      max-width:none;margin:0;height:100vh;overflow-y:auto;
      padding:16px 20px 60px;border-right:1px solid var(--line);
    }
    #deskBar{
      grid-column:2;grid-row:1;
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      padding:10px 20px;border-bottom:1px solid var(--line);
    }
    #deskBar .tip2{flex:1;min-width:200px;font-size:12px;color:#6d7a72}
    #deskBar .zoom{display:flex;gap:6px}
    #deskBar button{font-size:13px;padding:6px 14px;border-radius:20px}
    #deskBar button.on{background:var(--green);border-color:var(--green);color:#fff}
    #stageWrap{
      grid-column:2;grid-row:2;
      position:static;overflow:auto;border-bottom:0;
      padding:16px 20px 40px;touch-action:auto;
    }
    #tip,#foldBar{display:none}
    body.folded #stageBox{display:block}
  }

  @media print{
    .no-print{display:none!important}
    .sel{box-shadow:none!important}
    .card .pr.movable{outline:none!important}
    html,body{height:auto!important;overflow:visible!important}
    body{background:#fff;display:block!important}
    #stageWrap{position:static;padding:0;border:0;display:block;overflow:visible;height:auto!important}
    #stageBox{width:auto!important;height:auto!important;margin:0;overflow:visible;display:block!important}
    #stage{transform:none!important;width:210mm;height:auto}
    .pg,.pg:not(.cur){display:block!important;box-shadow:none;width:210mm;height:297mm;overflow:hidden;
      break-after:page;page-break-after:always}
    .pg:last-child{break-after:auto;page-break-after:auto}
    .pg.blank{display:none!important}
    @page{size:A4;margin:0}
  }
</style>
</head>
<body>

<div id="stageWrap">
  <div id="pager" class="no-print">
    <button id="pg-prev">◀</button>
    <span id="pg-label">第 1 / 1 頁</span>
    <button id="pg-next">▶</button>
    <button id="pg-add">＋新頁</button>
    <button id="pg-move" class="pg-move" hidden>移到這頁</button>
    <button id="pg-del" class="pg-del" hidden>刪除空白頁</button>
  </div>
  <div id="stageBox">
    <div id="stage"></div>
  </div>
  <div id="foldBar" class="no-print">
    <button id="b-fold">收合預覽</button>
    <div id="splitter" title="上下拖曳可調整預覽區高度"></div>
  </div>
</div>
<p id="tip" class="no-print">點卡片可編輯／拖曳移動／綠角拉大小／藍點旋轉</p>
<div id="deskBar" class="no-print">
  <span class="tip2">點卡片可編輯／拖曳移動／綠角拉大小／藍點旋轉</span>
  <div class="zoom">
    <button id="b-zoom-fit">整頁</button>
    <button id="b-zoom-w">放大</button>
  </div>
</div>

<div id="panel" class="no-print">

  <h2>卡片內容</h2>
  <div class="fld"><label for="f-name">品名</label><input id="f-name" type="text" placeholder="例：高麗菜"></div>
  <div class="row">
    <div class="fld"><label for="f-price">價格</label><input id="f-price" type="text" inputmode="decimal" placeholder="45"></div>
    <div class="fld"><label for="f-unit">單位</label><input id="f-unit" type="text" placeholder="/顆"></div>
  </div>
  <div class="fld"><label for="f-spec">產地規格</label><input id="f-spec" type="text" placeholder="雲林 · 產地直送 1.2kg↑"></div>
  <label style="margin-top:2px">排列方式</label>
  <div class="btns" style="grid-template-columns:1fr 1fr 1fr;margin-top:0;margin-bottom:8px">
    <button id="b-lay-v">直式<br><span class="sub">品名在上</span></button>
    <button id="b-lay-h">橫式<br><span class="sub">名左 價右</span></button>
    <button id="b-lay-all">套用全部</button>
  </div>
  <label class="chk"><input id="f-shopon" type="checkbox" checked>卡片下方顯示店名與綠線</label>
  <label class="chk"><input id="f-sale" type="checkbox">右上角特價標籤（黃底紅字）</label>
  <div class="row">
    <div class="fld"><label for="f-badge">標籤文字</label><input id="f-badge" type="text" placeholder="特價" value="特價"></div>
    <div class="fld"><label for="f-bstyle">標籤樣式</label>
      <select id="f-bstyle">
        <option value="tag">方框吊牌</option>
        <option value="burst">爆炸星</option>
        <option value="cloud">雲朵</option>
        <option value="double">兩行＋大底線</option>
        <option value="stamp">圓形印章</option>
        <option value="ribbon">角落斜帶</option>
      </select>
    </div>
  </div>

  <div id="dirty">欄位已修改，按下方「更新」才會套用到卡片</div>

  <div class="btns" style="margin-top:4px">
    <button id="b-shopon-all">店名全部顯示</button>
    <button id="b-shopoff-all">店名全部隱藏</button>
  </div>

  <div class="btns">
    <button class="b-main" id="b-add">加入</button>
    <button class="b-main" id="b-update">更新</button>
    <button id="b-copy">複製</button>
    <button class="b-warn" id="b-del">刪除</button>
    <button id="b-deselect">取消選取</button>
    <button id="b-auto">自動排整齊</button>
    <button class="b-print" id="b-print">列印</button>
  </div>

  <h2>版面微調</h2>
  <div class="row">
    <div class="fld"><label for="f-w">寬（mm）</label><input id="f-w" type="number" inputmode="decimal" step="0.5" min="25" max="204"></div>
    <div class="fld"><label for="f-h">高（mm）</label><input id="f-h" type="number" inputmode="decimal" step="0.5" min="25" max="291"></div>
  </div>
  <label style="margin-top:2px">分割版型（同時套用到「自動排整齊」）</label>
  <div class="btns" style="grid-template-columns:1fr 1fr 1fr;margin-top:0">
    <button id="b-g44">16 等分<br><span class="sub">4×4</span></button>
    <button id="b-g34">12 等分<br><span class="sub">直 3×4</span></button>
    <button id="b-g43">12 等分<br><span class="sub">橫 4×3</span></button>
  </div>
  <label style="margin-top:8px">實體卡規格</label>
  <div class="btns" style="grid-template-columns:1fr 1fr 1fr;margin-top:0">
    <button id="b-s1">冰箱小<br><span class="sub">80×30 · 18張</span></button>
    <button id="b-s2">冰箱大<br><span class="sub">160×40 · 7張</span></button>
    <button id="b-s3">常溫小<br><span class="sub">150×60 · 留底2cm</span></button>
  </div>
  <label class="chk"><input id="f-keep" type="checkbox">底部留白 2cm（插卡座用，不印字）</label>
  <label for="s-pad" style="margin-top:12px">格內留白 <span id="v-pad">8.0 mm</span></label>
  <div class="sl">
    <input id="s-pad" type="range" min="0" max="16" step="0.5" value="8">
    <button id="b-pad-all">套用全部</button>
  </div>
  <label for="s-fs" style="margin-top:10px">品項字體大小（整張卡） <span id="v-fs">100%</span></label>
  <div class="sl">
    <input id="s-fs" type="range" min="50" max="180" step="5" value="100">
    <button id="b-fs-all">套用全部</button>
  </div>
  <label for="s-rot" style="margin-top:10px">旋轉角度 <span id="v-rot">0°</span></label>
  <div class="sl">
    <input id="s-rot" type="range" min="-180" max="180" step="1" value="0">
    <button id="b-rot0">歸零</button>
  </div>
  <p class="tiny">拉桿只調整選取中的那張卡，拉了立刻生效；「套用全部」會套到所有卡片。品名／價格／單位／產地規格這四欄改完，要按「更新」才會套用。</p>

  <h2>價格數字</h2>
  <label for="s-pfs">價格文字大小 <span id="v-pfs">100%</span></label>
  <div class="sl">
    <input id="s-pfs" type="range" min="40" max="260" step="5" value="100">
    <button id="b-pfs-all">套用全部</button>
  </div>
  <label for="s-px" style="margin-top:10px">左右位移 <span id="v-px">0 mm</span></label>
  <input id="s-px" type="range" min="-80" max="80" step="1" value="0">
  <label for="s-py" style="margin-top:6px">上下位移 <span id="v-py">0 mm</span></label>
  <div class="sl">
    <input id="s-py" type="range" min="-120" max="120" step="1" value="0">
    <button id="b-p-reset">歸位</button>
  </div>
  <p class="tiny">卡片選取後，價格數字外圍會出現藍色虛線框，可直接用手指拖到想要的位置。</p>

  <h2>整體設定</h2>
  <div class="fld"><label for="f-shop">卡片下方店名</label><input id="f-shop" type="text" value="258民生雜糧行"></div>
  <label class="chk"><input id="f-crop" type="checkbox" checked>列印裁切虛線</label>
  <p class="tiny">淡綠虛線是 3mm 安全邊，只在螢幕顯示，不會印出。資料自動存在這台裝置。</p>
</div>

<script>
(function(){
  "use strict";

  /* ===== 單位換算 ===== */
  var probe=document.createElement('div');
  probe.style.cssText='position:absolute;width:100mm;height:0;visibility:hidden';
  document.body.appendChild(probe);
  var PXMM=probe.getBoundingClientRect().width/100;
  document.body.removeChild(probe);

  var PW=210, PH=297, M=3;                 // A4 與安全邊 (mm)
  var AX=M, AY=M, AW=PW-M*2, AH=PH-M*2;    // 可印區
  var DEF_W=AW/2, DEF_H=AH/2;              // 102 × 145.5
  var KEY='pricecards258.v1';

  var stage=document.getElementById('stage'),
      box=document.getElementById('stageBox'),
      wrap=document.getElementById('stageWrap'),
      pager=document.getElementById('pager');
  var KEEP=20;                              // 常溫卡留底 2cm

  var state={cards:[],shop:'258民生雜糧行',crop:true,seq:1,cell:{w:0,h:0,keep:0},ph:0,layout:'v',zoom:'fit',pages:1};
  var selId=null, scale=1, curP=0;
  var DESK=window.matchMedia('screen and (min-width:900px)');

  /* ===== 儲存 ===== */
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ /* 無痕模式或預覽環境不支援，忽略 */ }
  }
  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(!raw) return;
      var o=JSON.parse(raw);
      if(o&&Array.isArray(o.cards)){
        state.cards=o.cards;
        state.shop=o.shop||state.shop;
        state.crop=(o.crop!==false);
        state.seq=o.seq||(state.cards.length+1);
        if(o.cell&&o.cell.w) state.cell=o.cell;
        else if(o.grid&&o.grid.c) state.cell={w:AW/o.grid.c,h:AH/o.grid.r};
        state.ph=o.ph||0;
        state.layout=o.layout||'v';
        state.zoom=(o.zoom==='w')?'w':'fit';
        state.pages=o.pages||1;
        state.cards.forEach(function(c){ if(typeof c.p!=='number') c.p=0; if(!c.keep) c.keep=0; });
      }
    }catch(e){}
  }

  /* ===== 工具 ===== */
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function bbox(c){
    var r=(c.rot||0)*Math.PI/180, co=Math.abs(Math.cos(r)), si=Math.abs(Math.sin(r));
    return { w:c.w*co+c.h*si, h:c.w*si+c.h*co };
  }
  function fitInSafe(c){
    c.w=clamp(c.w,25,AW); c.h=clamp(c.h,25,AH);
    var b=bbox(c), cx=c.x+c.w/2, cy=c.y+c.h/2;
    cx = b.w>=AW ? AX+AW/2 : clamp(cx, AX+b.w/2, AX+AW-b.w/2);
    cy = b.h>=AH ? AY+AH/2 : clamp(cy, AY+b.h/2, AY+AH-b.h/2);
    c.x=cx-c.w/2; c.y=cy-c.h/2;
  }
  function cellSize(){
    var c=state.cell;
    return (c&&c.w&&c.h)?{w:c.w,h:c.h}:{w:DEF_W,h:DEF_H};
  }
  function gridOf(){
    var z=cellSize();
    return { c:Math.max(1,Math.floor(AW/z.w+1e-6)), r:Math.max(1,Math.floor(AH/z.h+1e-6)), w:z.w, h:z.h };
  }
  function byId(id){ for(var i=0;i<state.cards.length;i++) if(state.cards[i].id===id) return state.cards[i]; return null; }
  function sel(){ return selId?byId(selId):null; }

  /* ===== 多頁 ===== */
  function pageCount(){
    var n=Math.max(1,state.pages||1);
    state.cards.forEach(function(c){ n=Math.max(n,c.p+1); });
    return n;
  }
  function curPg(){ return stage.querySelector('.pg.cur'); }
  // 找第一個放得下 w×h 的空位（依頁、由上而下、由左而右）；都滿了就開新頁
  function findSlot(w,h,skip){
    var n=pageCount();
    function hit(p,x,y){
      if(x<AX-.01||y<AY-.01||x+w>AX+AW+.01||y+h>AY+AH+.01) return true;
      return state.cards.some(function(c){
        if(c===skip||c.p!==p) return false;
        var b=bbox(c), cx=c.x+c.w/2-b.w/2, cy=c.y+c.h/2-b.h/2;
        return x<cx+b.w-.01 && x+w>cx+.01 && y<cy+b.h-.01 && y+h>cy+.01;
      });
    }
    for(var p=0;p<n;p++){
      var xs=[AX], ys=[AY];
      state.cards.forEach(function(c){
        if(c===skip||c.p!==p) return;
        var b=bbox(c); xs.push(c.x+c.w/2+b.w/2); ys.push(c.y+c.h/2+b.h/2);
      });
      xs.sort(function(a,b){return a-b}); ys.sort(function(a,b){return a-b});
      for(var i=0;i<ys.length;i++) for(var j=0;j<xs.length;j++)
        if(!hit(p,xs[j],ys[i])) return {p:p,x:xs[j],y:ys[i]};
    }
    return {p:n,x:AX,y:AY};
  }

  /* ===== 舞台縮放 ===== */
  function fit(){
    if(DESK.matches){
      // 電腦版：右欄寬度內，「整頁」塞進螢幕高度，「放大」填滿寬度（可上下捲）
      var cs=getComputedStyle(wrap);
      var colW=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
      var colH=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-pager.offsetHeight;
      var sW=colW/(PW*PXMM), sH=colH/(PH*PXMM);
      scale = state.zoom==='w' ? Math.min(sW, 1.6) : Math.min(sW, sH);
      scale = Math.max(scale, 0.2);
    }else{
      var availW=Math.min(document.documentElement.clientWidth-20, 540);
      var maxH=window.innerHeight*0.92;
      var availH=state.ph ? Math.min(Math.max(state.ph,140), maxH) : Math.max(240, window.innerHeight*0.50);
      scale=Math.min(availW/(PW*PXMM), availH/(PH*PXMM));
    }
    stage.style.transform='scale('+scale+')';
    box.style.width=Math.round(PW*PXMM*scale)+'px';
    box.style.height=Math.round(PH*PXMM*scale)+'px';
  }

  /* ===== 特價標籤 ===== */
  var SVG=(function(){
    function burst(){
      var p=[],n=14,cx=50,cy=50;
      for(var i=0;i<n*2;i++){
        var a=Math.PI*i/n-Math.PI/2, r=(i%2?32:50);
        p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));
      }
      return '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="'+p.join(' ')+
             '" fill="#ffd60a" stroke="#d32f2f" stroke-width="3.5" stroke-linejoin="round"/></svg>';
    }
    function cloud(){
      var n=9,rx=36,ry=30,cx=50,cy=50,bump=17,d='';
      for(var i=0;i<=n;i++){
        var a=2*Math.PI*i/n-Math.PI/2;
        var x=(cx+rx*Math.cos(a)).toFixed(1), y=(cy+ry*Math.sin(a)).toFixed(1);
        d+= i===0 ? 'M'+x+' '+y : ' A'+bump+' '+bump+' 0 0 1 '+x+' '+y;
      }
      return '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="'+d+'Z'+
             '" fill="#ffd60a" stroke="#d32f2f" stroke-width="3.5" stroke-linejoin="round"/></svg>';
    }
    return { burst:burst(), cloud:cloud() };
  })();

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function makeBadge(c,k){
    var st=c.bstyle||'tag', t=esc(c.badge||'特價');
    var b=document.createElement('div');
    b.className='badge b-'+st;
    b.style.fontSize=(8*k)+'mm';
    if(st==='double'){
      b.innerHTML='<span class="bt">'+t+'</span><span class="bt">'+t+'</span>';
    }else{
      b.innerHTML=(SVG[st]||'')+'<span class="bt">'+t+'</span>';
    }
    return b;
  }

  /* ===== 繪製 ===== */
  function render(){
    var n=pageCount();
    state.pages=n;
    curP=clamp(curP,0,n-1);
    stage.innerHTML='';
    var pgs=[];
    for(var i=0;i<n;i++){
      var pg=document.createElement('div');
      pg.className='pg'+(i===curP?' cur':'');
      pg.dataset.p=i;
      pg.innerHTML='<div class="safe no-print"></div>';
      stage.appendChild(pg); pgs.push(pg);
    }

    // 字放不下就自動縮小（量測時暫時讓每一頁都可排版）
    stage.classList.add('measuring');
    state.cards.forEach(function(c){
      var host=pgs[c.p]||pgs[0], af=1, el=null;
      for(var t=0;t<18;t++){
        el=buildCard(c,af); host.appendChild(el);
        if(el.scrollHeight<=el.clientHeight+1 && el.scrollWidth<=el.clientWidth+1) break;
        if(t<17){ host.removeChild(el); af*=0.9; }
      }
      decorate(el,c,af);
    });
    stage.classList.remove('measuring');

    function buildCard(c,af){
      var k=(c.fs||100)/100*af, pad=(c.pad==null?8:c.pad);
      var el=document.createElement('div');
      el.className='card'+(c.sale?' sale':'')+(state.crop?' crop':'')+(c.id===selId?' sel':'');
      el.dataset.id=c.id;
      el.style.left=c.x+'mm'; el.style.top=c.y+'mm';
      el.style.width=c.w+'mm'; el.style.height=c.h+'mm';
      el.style.padding=pad+'mm';
      if(c.keep) el.style.paddingBottom=(pad+c.keep)+'mm';
      el.style.transform='rotate('+(c.rot||0)+'deg)';

      var nm=document.createElement('div');
      nm.className='nm'; nm.style.fontSize=(13*k)+'mm'; nm.textContent=c.name||'品名';

      var mid=document.createElement('div'); mid.className='mid';
      var pk=k*((c.pfs==null?100:c.pfs)/100);
      var pr=document.createElement('div'); pr.className='pr';
      pr.style.transform='translate('+(c.px||0)+'mm,'+(c.py||0)+'mm)';
      if(c.id===selId){ pr.dataset.act='price'; pr.classList.add('movable'); }
      var num=document.createElement('span');
      num.className='num'; num.style.fontSize=(32*pk)+'mm'; num.textContent=(c.price||'0');
      var un=document.createElement('span');
      un.className='un'; un.style.fontSize=(7.5*pk)+'mm'; un.textContent=c.unit||'';
      pr.appendChild(num); pr.appendChild(un);
      var sp=document.createElement('div');
      sp.className='sp'; sp.style.fontSize=(5.6*k)+'mm'; sp.textContent=c.spec||'';
      mid.appendChild(pr); if(c.spec && (c.layout||'v')!=='h') mid.appendChild(sp);

      var ft=document.createElement('div'); ft.className='ft';
      var bar=document.createElement('div'); bar.className='bar'; bar.style.height=(1.8*k)+'mm';
      var shop=document.createElement('div');
      shop.className='shop'; shop.style.fontSize=(5.4*k)+'mm'; shop.textContent=state.shop;
      ft.appendChild(bar); ft.appendChild(shop);

      if((c.layout||'v')==='h'){
        el.classList.add('lay-h');
        var lf=document.createElement('div'); lf.className='left';
        lf.appendChild(nm); if(c.spec) lf.appendChild(sp);
        if(c.showShop!==false) lf.appendChild(ft);
        var rt=document.createElement('div'); rt.className='rightcol';
        rt.appendChild(pr);
        el.appendChild(lf); el.appendChild(rt);
      }else{
        el.appendChild(nm); el.appendChild(mid);
        if(c.showShop!==false) el.appendChild(ft);
      }

      return el;
    }
    function decorate(el,c,af){
      var k=(c.fs||100)/100*af;
      if(c.sale) el.appendChild(makeBadge(c,k));
      if(c.keep){
        var kp=document.createElement('div'); kp.className='keep no-print';
        kp.style.height=c.keep+'mm'; kp.textContent='留底 '+(c.keep/10)+'cm（不印字）';
        el.appendChild(kp);
      }

      if(c.id===selId){
        var hs=Math.max(6, 30/(PXMM*scale));   // 螢幕上恆為約 30px 的觸控範圍
        var hr=document.createElement('div'); hr.className='hdl h-res no-print'; hr.dataset.act='resize';
        var ht=document.createElement('div'); ht.className='hdl h-rot no-print'; ht.dataset.act='rotate';
        hr.style.width=ht.style.width=hs+'mm';
        hr.style.height=ht.style.height=hs+'mm';
        el.appendChild(hr); el.appendChild(ht);
      }
    }
    // 沒有卡片的頁不列印（全部都空時保留第一頁）
    pgs.forEach(function(pg,i){
      if(!pg.querySelector('.card') && (state.cards.length || i>0)) pg.classList.add('blank');
    });
    renderPager();
    save();
  }

  function renderPager(){
    var n=state.pages, s=sel();
    document.getElementById('pg-label').textContent='第 '+(curP+1)+' / '+n+' 頁';
    document.getElementById('pg-prev').disabled=(curP<=0);
    document.getElementById('pg-next').disabled=(curP>=n-1);
    var mv=document.getElementById('pg-move');
    mv.hidden=!(s && s.p!==curP);
    if(s) mv.textContent='把「'+(s.name||'品名')+'」移到這頁';
    var empty=!state.cards.some(function(c){ return c.p===curP; });
    document.getElementById('pg-del').hidden=!(empty && n>1);
  }

  /* ===== 表單同步 ===== */
  var F={
    name:document.getElementById('f-name'), price:document.getElementById('f-price'),
    unit:document.getElementById('f-unit'), spec:document.getElementById('f-spec'),
    shopOn:document.getElementById('f-shopon'),
    sale:document.getElementById('f-sale'), badge:document.getElementById('f-badge'),
    bstyle:document.getElementById('f-bstyle'),
    shop:document.getElementById('f-shop'),
    crop:document.getElementById('f-crop'),
    w:document.getElementById('f-w'), h:document.getElementById('f-h'),
    keep:document.getElementById('f-keep')
  };
  var S={ pad:document.getElementById('s-pad'), fs:document.getElementById('s-fs'), rot:document.getElementById('s-rot'),
          pfs:document.getElementById('s-pfs'), px:document.getElementById('s-px'), py:document.getElementById('s-py') };
  var V={ pad:document.getElementById('v-pad'), fs:document.getElementById('v-fs'), rot:document.getElementById('v-rot'),
          pfs:document.getElementById('v-pfs'), px:document.getElementById('v-px'), py:document.getElementById('v-py') };

  function syncSliders(){
    V.pad.textContent=(+S.pad.value).toFixed(1)+' mm';
    V.fs.textContent=S.fs.value+'%';
    V.rot.textContent=S.rot.value+'°';
    V.pfs.textContent=S.pfs.value+'%';
    V.px.textContent=S.px.value+' mm';
    V.py.textContent=S.py.value+' mm';
  }
  function fillForm(c){
    F.name.value=c.name||''; F.price.value=c.price||'';
    F.unit.value=c.unit||''; F.spec.value=c.spec||''; F.sale.checked=!!c.sale;
    F.shopOn.checked=(c.showShop!==false);
    F.badge.value=c.badge||'特價'; F.bstyle.value=c.bstyle||'tag';
    S.pad.value=(c.pad==null?8:c.pad); S.fs.value=c.fs||100; S.rot.value=c.rot||0;
    F.w.value=Math.round(c.w*10)/10; F.h.value=Math.round(c.h*10)/10;
    S.pfs.value=(c.pfs==null?100:c.pfs); S.px.value=Math.round(c.px||0); S.py.value=Math.round(c.py||0);
    F.keep.checked=!!c.keep;
    syncSliders();
  }
  var dirtyBox=document.getElementById('dirty'), btnUpdate=null;
  function setDirty(on){
    dirtyBox.classList.toggle('show', !!on && !!selId);
    if(btnUpdate) btnUpdate.classList.toggle('hot', !!on && !!selId);
  }
  function select(id){ selId=id; var c=sel(); if(c){ fillForm(c); curP=c.p; } setDirty(false); markLayout(); render(); }

  /* ===== 指標操作：移動 / 縮放 / 旋轉 ===== */
  var drag=null;
  function ptMM(e){
    var pg=curPg(); if(!pg) return {x:0,y:0};
    var r=pg.getBoundingClientRect();
    return { x:(e.clientX-r.left)/(PXMM*scale), y:(e.clientY-r.top)/(PXMM*scale) };
  }
  var page=stage;   // 事件委派到舞台（所有頁都在裡面）
  page.addEventListener('pointerdown',function(e){
    var el=e.target.closest('.card'); if(!el) return;
    var c=byId(el.dataset.id); if(!c) return;
    if(c.id!==selId){ select(c.id); el=page.querySelector('.card[data-id="'+c.id+'"]'); }
    var ah=e.target.closest('[data-act]');
    var act=ah?ah.dataset.act:'move';
    var p=ptMM(e);
    drag={ id:c.id, act:act, p0:p,
           c0:{x:c.x,y:c.y,w:c.w,h:c.h,rot:c.rot||0,px:c.px||0,py:c.py||0},
           a0:Math.atan2(p.y-(c.y+c.h/2), p.x-(c.x+c.w/2))*180/Math.PI };
    try{ page.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });
  page.addEventListener('pointermove',function(e){
    if(!drag) return;
    var c=byId(drag.id); if(!c) return;
    var p=ptMM(e), dx=p.x-drag.p0.x, dy=p.y-drag.p0.y, o=drag.c0;

    if(drag.act==='move'){
      c.x=o.x+dx; c.y=o.y+dy;
    }else if(drag.act==='price'){
      var rp=-(o.rot)*Math.PI/180;
      c.px=clamp(o.px+(dx*Math.cos(rp)-dy*Math.sin(rp)),-120,120);
      c.py=clamp(o.py+(dx*Math.sin(rp)+dy*Math.cos(rp)),-160,160);
      var pel=page.querySelector('.card[data-id="'+c.id+'"] .pr');
      if(pel) pel.style.transform='translate('+c.px+'mm,'+c.py+'mm)';
      S.px.value=Math.round(c.px); S.py.value=Math.round(c.py); syncSliders();
      e.preventDefault(); return;
    }else if(drag.act==='resize'){
      var r=-(o.rot)*Math.PI/180;
      var lx=dx*Math.cos(r)-dy*Math.sin(r), ly=dx*Math.sin(r)+dy*Math.cos(r);
      var nw=clamp(o.w+lx,25,AW), nh=clamp(o.h+ly,25,AH);
      var rr=o.rot*Math.PI/180, C={x:o.x+o.w/2,y:o.y+o.h/2};
      var tlx=C.x+(-o.w/2)*Math.cos(rr)-(-o.h/2)*Math.sin(rr);
      var tly=C.y+(-o.w/2)*Math.sin(rr)+(-o.h/2)*Math.cos(rr);
      var ncx=tlx+(nw/2)*Math.cos(rr)-(nh/2)*Math.sin(rr);
      var ncy=tly+(nw/2)*Math.sin(rr)+(nh/2)*Math.cos(rr);
      c.w=nw; c.h=nh; c.x=ncx-nw/2; c.y=ncy-nh/2;
    }else if(drag.act==='rotate'){
      var a=Math.atan2(p.y-(o.y+o.h/2), p.x-(o.x+o.w/2))*180/Math.PI;
      var deg=o.rot+(a-drag.a0);
      deg=((deg+180)%360+360)%360-180;
      [0,15,30,45,60,90,-15,-30,-45,-60,-90,180,-180].forEach(function(s){
        if(Math.abs(deg-s)<3) deg=s;
      });
      c.rot=Math.round(deg);
      S.rot.value=c.rot; syncSliders();
    }
    fitInSafe(c);
    var el=page.querySelector('.card[data-id="'+c.id+'"]');
    if(el){
      el.style.left=c.x+'mm'; el.style.top=c.y+'mm';
      el.style.width=c.w+'mm'; el.style.height=c.h+'mm';
      el.style.transform='rotate('+(c.rot||0)+'deg)';
    }
    e.preventDefault();
  });
  function endDrag(){ if(drag){ drag=null; var c=sel(); if(c) fillForm(c); render(); } }
  page.addEventListener('pointerup',endDrag);
  page.addEventListener('pointercancel',endDrag);

  /* ===== 按鈕 ===== */
  function readForm(){
    return { name:F.name.value.trim(), price:F.price.value.trim(),
             unit:F.unit.value.trim(), spec:F.spec.value.trim(), sale:F.sale.checked,
             badge:(F.badge.value.trim()||'特價'), bstyle:F.bstyle.value,
             showShop:F.shopOn.checked };
  }
  function freeSpot(){
    var g=gridOf(), s=findSlot(g.w,g.h,null);
    return { p:s.p, x:s.x, y:s.y, w:g.w, h:g.h };
  }
  btnUpdate=document.getElementById('b-update');
  ['name','price','unit','spec'].forEach(function(k){
    F[k].addEventListener('input', function(){ setDirty(true); });
  });

  document.getElementById('b-add').onclick=function(){
    var f=readForm(), s=freeSpot();
    var c={ id:'c'+(state.seq++), name:f.name||'品名', price:f.price||'0', unit:f.unit, spec:f.spec,
            sale:f.sale, badge:f.badge, bstyle:f.bstyle, showShop:f.showShop,
            layout:state.layout, p:s.p, x:s.x, y:s.y, w:s.w, h:s.h, rot:0, pad:+S.pad.value, fs:+S.fs.value,
            keep:(F.keep.checked?KEEP:0) };
    fitInSafe(c); state.cards.push(c); select(c.id);
  };
  document.getElementById('b-update').onclick=function(){
    var c=sel(); if(!c) return;
    var f=readForm();
    c.name=f.name; c.price=f.price; c.unit=f.unit; c.spec=f.spec; c.sale=f.sale; c.badge=f.badge; c.bstyle=f.bstyle; c.showShop=f.showShop;
    c.pad=+S.pad.value; c.fs=+S.fs.value; c.rot=+S.rot.value;
    fitInSafe(c); setDirty(false); render();
  };
  document.getElementById('b-copy').onclick=function(){
    var c=sel(); if(!c) return;
    var n=JSON.parse(JSON.stringify(c));
    n.id='c'+(state.seq++);
    var b=bbox(c), s=findSlot(b.w,b.h,null);
    n.p=s.p; n.x=s.x+b.w/2-c.w/2; n.y=s.y+b.h/2-c.h/2; fitInSafe(n);
    state.cards.push(n); select(n.id);
  };
  document.getElementById('b-del').onclick=function(){
    var c=sel(); if(!c) return;
    state.cards=state.cards.filter(function(x){ return x.id!==c.id; });
    selId=null; render();
  };
  document.getElementById('b-deselect').onclick=function(){ selId=null; setDirty(false); render(); };
  document.getElementById('b-auto').onclick=function(){
    var g=gridOf(), n=g.c*g.r;
    var keep=(state.cell&&state.cell.keep)||0;
    state.cards.forEach(function(c,i){
      var s2=i%n;
      c.rot=0; c.w=g.w; c.h=g.h; c.p=Math.floor(i/n);
      if(state.cell&&state.cell.w) c.keep=keep;
      c.x=AX+(s2%g.c)*g.w; c.y=AY+Math.floor(s2/g.c)*g.h;
      fitInSafe(c);
    });
    state.pages=Math.max(1,Math.ceil(state.cards.length/n));
    var c2=sel(); if(c2){ fillForm(c2); curP=c2.p; } else curP=0;
    render();
  };
  document.getElementById('b-print').onclick=function(){ window.print(); };

  S.pad.oninput=function(){ syncSliders(); var c=sel(); if(c){ c.pad=+S.pad.value; render(); } };
  S.fs.oninput =function(){ syncSliders(); var c=sel(); if(c){ c.fs=+S.fs.value; render(); } };
  S.rot.oninput=function(){ syncSliders(); var c=sel(); if(c){ c.rot=+S.rot.value; fitInSafe(c); render(); } };
  S.pfs.oninput=function(){ syncSliders(); var c=sel(); if(c){ c.pfs=+S.pfs.value; render(); } };
  S.px.oninput =function(){ syncSliders(); var c=sel(); if(c){ c.px=+S.px.value; render(); } };
  S.py.oninput =function(){ syncSliders(); var c=sel(); if(c){ c.py=+S.py.value; render(); } };
  document.getElementById('b-pfs-all').onclick=function(){
    var v=+S.pfs.value; state.cards.forEach(function(c){ c.pfs=v; }); render();
  };
  document.getElementById('b-p-reset').onclick=function(){
    var c=sel(); if(!c) return;
    c.px=0; c.py=0; c.pfs=100; fillForm(c); render();
  };
  document.getElementById('b-pad-all').onclick=function(){
    var v=+S.pad.value; state.cards.forEach(function(c){ c.pad=v; }); render();
  };
  document.getElementById('b-fs-all').onclick=function(){
    var v=+S.fs.value; state.cards.forEach(function(c){ c.fs=v; }); render();
  };
  document.getElementById('b-rot0').onclick=function(){
    S.rot.value=0; syncSliders(); var c=sel(); if(c){ c.rot=0; fitInSafe(c); render(); }
  };
  function setSize(w,h){
    var c=sel(); if(!c) return;
    if(w) c.w=clamp(w,25,AW);
    if(h) c.h=clamp(h,25,AH);
    fitInSafe(c); fillForm(c); render();
  }
  F.w.oninput=function(){ var v=parseFloat(F.w.value); if(!isNaN(v)) setSize(v,null); };
  F.h.oninput=function(){ var v=parseFloat(F.h.value); if(!isNaN(v)) setSize(null,v); };
  var PRESET={ 'b-g44':[AW/4,AH/4], 'b-g34':[AW/3,AH/4], 'b-g43':[AW/4,AH/3],
               'b-s1':[80,30,0,2], 'b-s2':[160,40,0,3], 'b-s3':[150,60,KEEP,3] };   // [寬,高,留底,留白]
  function markGrid(){
    var z=cellSize();
    Object.keys(PRESET).forEach(function(id){
      var v=PRESET[id];
      document.getElementById(id).classList.toggle('on',
        Math.abs(z.w-v[0])<0.05 && Math.abs(z.h-v[1])<0.05);
    });
  }
  Object.keys(PRESET).forEach(function(id){
    document.getElementById(id).onclick=function(){
      var v=PRESET[id], keep=v[2]||0;
      state.cell={w:v[0],h:v[1],keep:keep};
      F.keep.checked=keep>0;
      var c=sel(); if(c) c.keep=keep;
      if(id.indexOf('b-s')===0){           // 實體卡是橫條，預設改橫式（可再切回直式）
        state.layout='h'; if(c) c.layout='h'; markLayout();
        S.pad.value=v[3]; syncSliders(); if(c) c.pad=v[3];
      }
      markGrid(); setSize(v[0],v[1]); render();
    };
  });
  F.keep.onchange=function(){
    var c=sel(); if(c){ c.keep=F.keep.checked?KEEP:0; render(); }
  };

  /* ===== 換頁 ===== */
  document.getElementById('pg-prev').onclick=function(){ curP=Math.max(0,curP-1); render(); };
  document.getElementById('pg-next').onclick=function(){ curP=Math.min(state.pages-1,curP+1); render(); };
  document.getElementById('pg-add').onclick=function(){ state.pages=pageCount()+1; curP=state.pages-1; render(); };
  document.getElementById('pg-move').onclick=function(){
    var c=sel(); if(!c) return;
    var b=bbox(c);
    c.p=curP;
    // 在這頁由上而下找空位；找不到就維持原座標
    var here=null, n0=state.pages;
    for(var yy=AY; yy<=AY+AH-b.h+.01 && !here; yy+=1){
      for(var xx=AX; xx<=AX+AW-b.w+.01; xx+=1){
        var ok=!state.cards.some(function(o){
          if(o===c||o.p!==curP) return false;
          var ob=bbox(o), ox=o.x+o.w/2-ob.w/2, oy=o.y+o.h/2-ob.h/2;
          return xx<ox+ob.w-.01 && xx+b.w>ox+.01 && yy<oy+ob.h-.01 && yy+b.h>oy+.01;
        });
        if(ok){ here={x:xx,y:yy}; break; }
      }
    }
    if(here){ c.x=here.x+b.w/2-c.w/2; c.y=here.y+b.h/2-c.h/2; }
    state.pages=n0; fitInSafe(c); render();
  };
  document.getElementById('pg-del').onclick=function(){
    if(state.cards.some(function(c){ return c.p===curP; })) return;
    state.cards.forEach(function(c){ if(c.p>curP) c.p--; });
    state.pages=Math.max(1,state.pages-1);
    curP=Math.min(curP,state.pages-1); render();
  };

  /* 預覽區分隔線：拖曳調整高度（手機版） */
  (function(){
    var sp=document.getElementById('splitter'), st=null;
    sp.addEventListener('pointerdown',function(e){
      st={y:e.clientY, h:box.getBoundingClientRect().height};
      sp.setPointerCapture&&sp.setPointerCapture(e.pointerId); e.preventDefault();
    });
    sp.addEventListener('pointermove',function(e){
      if(!st) return;
      state.ph=Math.max(140, st.h+(e.clientY-st.y));
      fit(); render(); e.preventDefault();
    });
    function done(){ if(st){ st=null; save(); } }
    sp.addEventListener('pointerup',done);
    sp.addEventListener('pointercancel',done);
    sp.addEventListener('dblclick',function(){ state.ph=0; fit(); render(); save(); });
  })();

  document.getElementById('b-fold').onclick=function(){
    var f=document.body.classList.toggle('folded');
    this.textContent=f?'展開預覽':'收合預覽';
  };

  /* 電腦版縮放：整頁 / 放大 */
  function markZoom(){
    document.getElementById('b-zoom-fit').classList.toggle('on', state.zoom!=='w');
    document.getElementById('b-zoom-w').classList.toggle('on', state.zoom==='w');
  }
  function setZoom(z){ state.zoom=z; markZoom(); fit(); render(); }
  document.getElementById('b-zoom-fit').onclick=function(){ setZoom('fit'); };
  document.getElementById('b-zoom-w').onclick=function(){ setZoom('w'); };

  function liveBadge(){
    var c=sel(); if(!c) return;
    c.sale=F.sale.checked; c.badge=F.badge.value.trim()||'特價'; c.bstyle=F.bstyle.value; render();
  }
  function markLayout(){
    var c=sel(), v=c?(c.layout||'v'):state.layout;
    document.getElementById('b-lay-v').classList.toggle('on', v==='v');
    document.getElementById('b-lay-h').classList.toggle('on', v==='h');
  }
  function setLayout(v){
    state.layout=v;
    var c=sel(); if(c) c.layout=v;
    markLayout(); render(); save();
  }
  document.getElementById('b-lay-v').onclick=function(){ setLayout('v'); };
  document.getElementById('b-lay-h').onclick=function(){ setLayout('h'); };
  document.getElementById('b-lay-all').onclick=function(){
    var c=sel(), v=c?(c.layout||'v'):state.layout;
    state.cards.forEach(function(x){ x.layout=v; }); render(); save();
  };

  F.shopOn.onchange=function(){ var c=sel(); if(c){ c.showShop=F.shopOn.checked; render(); } };
  document.getElementById('b-shopon-all').onclick=function(){
    state.cards.forEach(function(c){ c.showShop=true; }); F.shopOn.checked=true; render();
  };
  document.getElementById('b-shopoff-all').onclick=function(){
    state.cards.forEach(function(c){ c.showShop=false; }); F.shopOn.checked=false; render();
  };
  F.sale.onchange=liveBadge; F.bstyle.onchange=liveBadge; F.badge.oninput=liveBadge;

  F.shop.oninput=function(){ state.shop=F.shop.value; render(); };
  F.crop.onchange=function(){ state.crop=F.crop.checked; render(); };

  /* ===== 啟動 ===== */
  load();
  F.shop.value=state.shop; F.crop.checked=state.crop;
  if(!state.cards.length){
    [['高麗菜','45','/顆','雲林西螺 · 1.2kg↑',false],
     ['珍珠芭樂','89','/斤','燕巢 · 特級大顆',true]].forEach(function(a,i){
      state.cards.push({ id:'c'+(state.seq++), name:a[0], price:a[1], unit:a[2], spec:a[3], sale:a[4], badge:'特價',
        p:0, x:AX+(i%2)*DEF_W, y:AY, w:DEF_W, h:DEF_H, rot:0, pad:8, fs:100, keep:0 });
    });
  }
  syncSliders(); markGrid(); markLayout(); markZoom(); fit(); render();
  function refit(){ fit(); render(); }
  window.addEventListener('resize',refit);
  window.addEventListener('orientationchange',function(){ setTimeout(refit,200); });
  if(DESK.addEventListener) DESK.addEventListener('change',refit);
})();
</script>
</body>
</html>
